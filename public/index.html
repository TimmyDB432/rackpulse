<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RackPulse | Prosumer & Homelab Gear Intelligence</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-cyan-500 selection:text-slate-950">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="h-3 w-3 bg-cyan-500 rounded-full animate-pulse"></div>
                <span class="text-xl font-bold tracking-tight text-white">RACK<span class="text-cyan-400">PULSE</span></span>
                <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700 mono">v1.0.0</span>
            </div>
            <div class="text-xs text-slate-400 mono">
                Status: <span class="text-emerald-400 font-semibold">Live / Syncing</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Hero / Search Section -->
        <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-white">Homelab & Infrastructure Feed</h1>
                <p class="text-slate-400 text-sm mt-1">Automated gear tracking, hardware releases, and prosumer tech intelligence.</p>
            </div>
            <div class="w-full md:w-80">
                <input type="text" id="searchInput" placeholder="Search gear, specs, or keywords..." 
                    class="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-colors">
            </div>
        </div>

        <!-- Grid Container for Items -->
        <div id="gearGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading Skeleton State -->
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-xl p-5 animate-pulse">
                <div class="h-4 bg-slate-800 rounded w-1/4 mb-4"></div>
                <div class="h-6 bg-slate-800 rounded w-3/4 mb-3"></div>
                <div class="h-16 bg-slate-800/50 rounded mb-4"></div>
                <div class="h-3 bg-slate-800 rounded w-1/2"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 mt-20 py-8 text-center text-xs text-slate-500">
        <p>&copy; 2026 RackPulse.dev. Automated infrastructure tracking matrix.</p>
    </footer>

    <!-- Frontend Logic Script -->
    <script>
        let allGearData = [];

        async function fetchGearData() {
            try {
                const response = await fetch('./data.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error('Failed to load data matrix.');
                allGearData = await response.json();
                renderGrid(allGearData);
            } catch (error) {
                document.getElementById('gearGrid').innerHTML = `
                    <div class="col-span-full text-center py-12 text-rose-400 bg-rose-950/20 border border-rose-900/30 rounded-xl">
                        <p class="font-medium">Error loading data feed.</p>
                        <p class="text-xs text-slate-400 mt-1">Make sure data.json exists in the public directory.</p>
                    </div>
                `;
            }
        }

        function renderGrid(items) {
            const grid = document.getElementById('gearGrid');
            if (items.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500">
                        <p>No gear records found matching your criteria.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="bg-slate-900/70 border border-slate-800 hover:border-slate-700 rounded-xl p-5 flex flex-col justify-between transition-all duration-200 group">
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-cyan-950/60 text-cyan-400 border border-cyan-800/50 mono">
                                ${item.category || 'Hardware'}
                            </span>
                            <span class="text-xs text-slate-500 mono">${new Date(item.published).toLocaleDateString()}</span>
                        </div>
                        <h2 class="text-lg font-semibold text-white group-hover:text-cyan-400 transition-colors mb-2 line-clamp-2">
                            ${item.title}
                        </h2>
                        <p class="text-slate-400 text-sm leading-relaxed mb-6 line-clamp-3">
                            ${item.summary}
                        </p>
                    </div>
                    <div>
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center text-xs font-medium text-cyan-400 hover:text-cyan-300 transition-colors">
                            View Source / Specs 
                            <svg class="w-3.5 h-3.5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                            </svg>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Live Search Filtering
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allGearData.filter(item => 
                item.title.toLowerCase().includes(query) || 
                item.summary.toLowerCase().includes(query) ||
                (item.category && item.category.toLowerCase().includes(query))
            );
            renderGrid(filtered);
        });

        // Initialize on load
        fetchGearData();
    </script>
</body>
</html>
